name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          check-latest: true

      # Temporary remote-only diagnostic: capture the exact module metadata required
      # after raising the Go directive, without running Go on the local worker.
      - name: Diagnose module tidy diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify
        run: make ci
